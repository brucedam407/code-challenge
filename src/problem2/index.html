<!doctype html>
<html lang="en" data-theme="ink">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Meridian Convert - exchange any listed asset at live feed rates."
    />
    <title>Meridian · Convert</title>

    <link rel="icon" href="./tokens/SWTH.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <script>
      // Stamp the theme before first paint, so a light-theme user never sees a
      // dark flash. Kept inline and tiny for exactly that reason.
      ;(function () {
        try {
          var stored = localStorage.getItem('meridian.theme.v1')
          var theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch (error) {
          document.documentElement.dataset.theme = 'dark'
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
